<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Set Operators</title>

    <style>
          :root {
            --wood: #d9a15f;
            --wood-dark: #c78f4d;
            --court-line: #f7efe0;
            --board: #1c1f26;
            --board-input: #2a2e38;
            --board-border: #3a3f4b;
            --ball: #e8601c;
            --ball-dark: #c24a0f;
            --ball-soft: rgba(232, 96, 28, 0.35);
            --ink: #1c1f26;
            --text: #f4efe6;
            --muted: #9aa0ad;
            --ok-bg: rgba(232, 96, 28, 0.16);
            --ok-text: #ffb98f;
            --roster-bg: rgba(244, 239, 230, 0.07);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--ink);
            font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            /* hardwood planks + a center-court ring */
            background:
                radial-gradient(circle at 50% 50%, transparent 0 15rem, var(--court-line) 15rem 15.25rem, transparent 15.25rem),
                repeating-linear-gradient(90deg,
                    var(--wood) 0 5.5rem,
                    var(--wood-dark) 5.5rem 5.6rem);
            background-attachment: fixed;
        }

        h1 {
            margin: 0 0 1.25rem;
            font-family: "Anton", Impact, "Arial Narrow", sans-serif;
            font-size: clamp(1.9rem, 6vw, 2.75rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 0.02em;
            text-align: center;
            text-transform: uppercase;
            color: var(--ink);
            text-shadow: 0 2px 0 rgba(247, 239, 224, 0.55);
        }

        form {
            width: 100%;
            max-width: 22rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1.75rem;
            background: var(--board);
            border: 1px solid var(--board-border);
            border-top: 6px solid var(--ball);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(28, 31, 38, 0.35);
        }

        form br { display: none; }

        input[type="text"] {
            width: 100%;
            padding: 0.7rem 0.85rem;
            font: inherit;
            color: var(--text);
            background: var(--board-input);
            border: 1px solid var(--board-border);
            border-radius: 4px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]::placeholder { color: var(--muted); }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--ball);
            box-shadow: 0 0 0 3px var(--ball-soft);
        }

        input[type="button"] {
            margin-top: 0.25rem;
            padding: 0.75rem 1rem;
            font-family: "Anton", Impact, "Arial Narrow", sans-serif;
            font-size: 1.05rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fff;
            background: var(--ball);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }

        input[type="button"]:hover { background: var(--ball-dark); }

        input[type="button"]:focus-visible {
            outline: 3px solid var(--ball-soft);
            outline-offset: 2px;
        }

        #results {
            width: 100%;
            max-width: 22rem;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #results:empty { display: none; }

        /* each display() call renders as a div inside #results */
        #results > div {
            padding: 0.8rem 1rem;
            border-radius: 4px;
            border-left: 4px solid var(--ball);
            background: var(--board);
            color: var(--text);
            line-height: 1.4;
            overflow-wrap: anywhere;
            box-shadow: 0 6px 18px rgba(28, 31, 38, 0.25);
        }

        /* first line is the result of the check (added / already on roster) */
        #results > div:first-child {
            background: var(--board);
            color: var(--ok-text);
            font-weight: 600;
        }
    </style>

</head>
<body>

      <h1>Add a new member to Varsity</h1>
        <form>
            <input type="text" id="first_name" placeholder="Enter your First name"><br>
            <input type="text" id="last_name" placeholder="Enter your Last name"><br>
            <input type="button" py-click="varsity" value="Add player">
        </form>

        <div id="results"></div>
    <py-script src="main.py"></py-script>
</body>
</html>
